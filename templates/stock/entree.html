{% extends 'base.html' %}
{% block title %}Entrée stock – Bignon AquaStock{% endblock %}

{% block content %}

<div class="row mb-3 align-items-center">
    <div class="col">
        <h4 class="fw-bold text-aqua mb-0">
            <i class="bi bi-plus-circle-fill me-2"></i>Entrée de stock
        </h4>
    </div>
    <div class="col-auto">
        <a href="{% url 'stock:liste' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-basket2 me-1"></i>Produit *
                        </label>
                        <select name="produit" class="form-select form-select-lg" required>
                            <option value="">-- Choisir un produit --</option>
                            {% for produit in produits %}
                            <option value="{{ produit.pk }}">
                                {{ produit.nom }} (Stock actuel : {{ produit.stock_actuel }} {{ produit.unite }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="bi bi-123 me-1"></i>Quantité reçue *
                        </label>
                        <input type="number" name="quantite" class="form-control form-control-lg"
                               step="0.01" min="0.01"
                               placeholder="Ex: 50" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="bi bi-card-text me-1"></i>Motif
                        </label>
                        <input type="text" name="motif" class="form-control"
                               placeholder="Ex: Livraison fournisseur"
                               value="Livraison fournisseur">
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{% url 'stock:liste' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg me-1"></i>Annuler
                        </a>
                        <button type="submit" class="btn btn-aqua text-white px-4">
                            <i class="bi bi-floppy-fill me-1"></i>Enregistrer
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
