{% extends 'base.html' %}
{% block title %}Ajouter une dépense – Bignon AquaStock{% endblock %}

{% block content %}

<div class="row mb-3 align-items-center">
    <div class="col">
        <h4 class="fw-bold text-aqua mb-0">
            <i class="bi bi-plus-circle-fill me-2"></i>Ajouter une dépense
        </h4>
    </div>
    <div class="col-auto">
        <a href="{% url 'depenses:liste' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label fw-bold">
                                <i class="bi bi-tag me-1"></i>Catégorie *
                            </label>
                            <select name="categorie" class="form-select" required>
                                <option value="">-- Choisir --</option>
                                {% for val, label in categories %}
                                <option value="{{ val }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">
                                <i class="bi bi-card-text me-1"></i>Description *
                            </label>
                            <input type="text" name="description"
                                   class="form-control"
                                   placeholder="Ex: Achat 50kg de Tilapia"
                                   required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">
                                <i class="bi bi-cash me-1"></i>Montant (FCFA) *
                            </label>
                            <input type="number" name="montant"
                                   class="form-control"
                                   step="1" min="1"
                                   placeholder="0" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">
                                <i class="bi bi-chat-text me-1"></i>Note
                            </label>
                            <textarea name="note" class="form-control"
                                      rows="3"
                                      placeholder="Optionnel"></textarea>
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-2">
                            <a href="{% url 'depenses:liste' %}"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-aqua text-white px-4">
                                <i class="bi bi-floppy-fill me-1"></i>Enregistrer
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
